name: morning

on:
  schedule:
    # The device wakes at 04:00 and 18:00 local. GitHub cron is best-effort and
    # can run an hour or more late, especially at busy minutes like :00/:15/:30,
    # so start early, use odd minutes, and take several shots. These cover
    # 01:37-03:07 and 15:37-17:07 local in both GMT and BST.
    - cron: "37 1 * * *"
    - cron: "7 2 * * *"
    - cron: "37 2 * * *"
    - cron: "7 3 * * *"
    - cron: "37 15 * * *"
    - cron: "7 16 * * *"
    - cron: "37 16 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Tests
        run: |
          bundle exec rake test
          npx elm-test


      - name: Build frame
        run: bundle exec rake build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
