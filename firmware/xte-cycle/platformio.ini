; xte-cycle firmware for the Xteink X3 (ESP32-C3). Uses the FreeInk SDK
; (git submodule at ../freeink-sdk) for the panel driver and board profile.
; WiFi credentials come from secrets.ini (see secrets.example.ini).
[platformio]
extra_configs = secrets.ini

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X3=1
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASS="${secrets.wifi_pass}"'
    '-DFRAME_URL="https://techbelly.github.io/xte-cycle/frame.bin"'
lib_deps =
    BoardConfig=symlink://${PROJECT_DIR}/../freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://${PROJECT_DIR}/../freeink-sdk/libs/display/FreeInkDisplay
    XteinkDetect=symlink://${PROJECT_DIR}/../freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://${PROJECT_DIR}/../freeink-sdk/libs/hardware/Imu
